<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b121b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Worship Music</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="stylesheet" href="./player.css"></head><body><main class="shell"><header><div><small>LIVE WORSHIP</small><h1>Worship Music</h1></div><button id="shuffleTop">⤨</button></header><section id="empty" class="hidden"><h2>No live recordings yet</h2></section><section id="app"><article class="now"><div class="art">♫</div><small>NOW PLAYING</small><h2 id="title">Choose a song</h2><p id="artist">Live worship recording</p><input id="seek" type="range" min="0" max="1000" value="0"><div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div><div class="controls"><button id="shuffle">⤨</button><button id="prev">◀◀</button><button id="play">▶</button><button id="next">▶▶</button><button id="repeat" class="active">↻</button></div></article><section class="library"><div class="heading"><div><small>LIBRARY</small><h2>Live Recordings</h2></div><b id="count"></b></div><input id="search" type="search" placeholder="Search live recordings…"><div id="list"></div></section></section></main><audio id="audio" preload="metadata"></audio><script src="../js/music-library.js"></script><script src="./player.js"></script></body></html>
