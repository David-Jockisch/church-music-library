<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Church Music Importer</title><style>body{margin:0;background:#f5f7fb;color:#172334;font:15px system-ui,Segoe UI,sans-serif}header{background:#173456;color:white;padding:22px max(20px,calc((100vw - 1150px)/2))}h1{margin:0;font-size:26px}main{max-width:1150px;margin:24px auto;padding:0 18px}.bar,.panel{background:white;border:1px solid #dfe4ec;border-radius:12px;padding:17px;margin-bottom:15px}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button{border:0;background:#225e9e;color:white;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:600}button.secondary{background:#e9eef5;color:#22354a}button:disabled{opacity:.5;cursor:wait}input,select{padding:9px;border:1px solid #cbd5e1;border-radius:7px;background:white;min-width:0}input{width:100%;box-sizing:border-box}label{display:block;color:#4a5a6d;font-size:12px;margin-bottom:4px}small{color:#617083}.item{border-top:1px solid #e7ebf0;padding:14px 0}.item:first-child{border-top:0}.itemHead{display:flex;justify-content:space-between;gap:12px;align-items:center}.filename{font-weight:700;overflow-wrap:anywhere}.fields{display:grid;grid-template-columns:1.5fr 1.2fr 1fr 1fr;gap:10px;margin-top:12px}.fields>div{min-width:0}.muted{color:#637286}.tag{background:#e9f4ed;color:#23653e;border-radius:20px;padding:4px 9px;font-size:12px}.warn{background:#fff2dd;color:#825100}.message{white-space:pre-wrap;padding:12px;border-radius:8px;background:#eaf2fb;margin-bottom:14px}#results{white-space:pre-wrap}.hidden{display:none}@media(max-width:750px){.fields{grid-template-columns:1fr 1fr}.bar{align-items:stretch}}@media(max-width:450px){.fields{grid-template-columns:1fr}}</style><header><h1>Church Music Importer</h1><div>Scan → Match → Review → Import → Publish</div></header><main><div class="bar"><button id="scan">↻ Scan iCloud folders</button><button id="import">Import approved files</button><button id="publish" class="secondary">Push library to GitHub</button><span id="counts"></span></div><div id="message" class="message hidden"></div><section class="panel"><b>Source folders</b><div id="sources"></div><small>Files are reviewed locally. Nothing uploads until you choose Import.</small></section><section class="panel"><div class="bar"><b>Review queue</b><label style="margin-left:auto"><input id="showExisting" type="checkbox" style="width:auto"> Show already imported</label></div><div id="queue"></div></section><section class="panel"><b>Last operation</b><pre id="results">No changes made yet.</pre></section></main><script>
let state={queue:[],library:[],sources:[]},working=false;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,data={}){const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const x=await r.json();if(!r.ok)throw Error(x.error);return x}function message(s){$('message').textContent=s;$('message').classList.remove('hidden')}function render(){const q=state.queue;$('counts').textContent=`${q.filter(x=>x.action==='add').length} ready · ${q.filter(x=>x.existing).length} already imported`;$('sources').innerHTML=state.sources.map(s=>`<p><b>${esc(s.name)}:</b> <small>${esc(s.path)}</small></p>`).join('');const shown=q.filter(x=>$('showExisting').checked||!x.existing);$('queue').innerHTML=shown.length?shown.map(x=>`<div class="item" data-id="${x.id}"><div class="itemHead"><div><div class="filename">${esc(x.asset.filename)}</div><small>${esc(x.asset.sourceName)} · ${esc(x.asset.type==='sheet'?'PDF':'Audio')}</small></div><span class="tag ${x.existing?'':'warn'}">${x.existing?'Already imported':'Review'}</span></div><div class="fields"><div><label>Destination song</label><select class="song"><option value="">New song</option>${state.library.map(s=>`<option value="${esc(s.id)}" ${s.id===x.songId?'selected':''}>${esc(s.title)}</option>`).join('')}</select></div><div><label>Song title (for new song)</label><input class="title" value="${esc(x.title)}"></div><div><label>File label</label><input class="label" value="${esc(x.label)}"></div><div><label>Action</label><select class="action"><option value="add" ${x.action==='add'?'selected':''}>Import</option><option value="skip" ${x.action==='skip'?'selected':''}>Skip</option></select></div></div><div style="display:flex;gap:10px;align-items:center;margin-top:10px"><button class="save secondary">Save review changes</button><small>${x.songId?'Attach to existing song':'Create or group by song title'}</small></div></div>`).join(''):'<p class="muted">No files to review.</p>';document.querySelectorAll('.save').forEach(b=>b.onclick=async()=>{const e=b.closest('.item'),id=Number(e.dataset.id);try{state=await api('edit',{id,songId:e.querySelector('.song').value,title:e.querySelector('.title').value,label:e.querySelector('.label').value,action:e.querySelector('.action').value});render();message('Review changes saved locally. No files uploaded.')}catch(err){message(err.message)}})}async function run(fn){if(working)return;working=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn()}catch(e){message('Error: '+e.message)}finally{working=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}$('scan').onclick=()=>run(async()=>{state=await api('scan');render();message('Scan complete. Review matches before importing.')});$('import').onclick=()=>run(async()=>{const n=state.queue.filter(x=>x.action==='add').length;if(!n)return message('Nothing selected for import.');if(!confirm(`Import ${n} selected file(s) to Cloudflare R2 and update the local library?`))return;const r=await api('import');state=r.state;render();$('results').textContent=r.results.map(x=>`${x.status}: ${x.file}${x.error?' — '+x.error:''}`).join('\n');message('Import finished. Review results, then push library to GitHub.')});$('publish').onclick=()=>run(async()=>{if(!confirm('Commit and push js/music-library.js to GitHub?'))return;const r=await api('publish');message(r.message)});$('showExisting').onchange=render;fetch('/api/state').then(r=>r.json()).then(x=>{state=x;render()}).catch(e=>message(e.message));
</script></html>
